[package]
name = "opencode-client"
version = "0.1.0"
edition = "2021"
description = "Sailfish OS client for opencode server (Rust + QML)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
cpal = "0.15"
hound = "3"

[profile.release]
opt-level = "s"